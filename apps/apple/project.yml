name: AgentPanel
options:
  bundleIdPrefix: dev.agentpanel
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  AgentPanel:
    type: application
    platform: iOS
    sources: [AgentPanel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentpanel.client
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: AgentPanel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你本地部署的 AgentPanel Relay。
  AgentPanelMac:
    type: application
    platform: macOS
    sources: [AgentPanel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentpanel.client.mac
        INFOPLIST_KEY_CFBundleDisplayName: AgentPanel
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
schemes:
  AgentPanel:
    build:
      targets:
        AgentPanel: all
  AgentPanelMac:
    build:
      targets:
        AgentPanelMac: all
