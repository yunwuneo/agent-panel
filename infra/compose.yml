name: agentpanel
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentpanel
      POSTGRES_USER: agentpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpanel -d agentpanel"]
      interval: 3s
      timeout: 3s
      retries: 20
  relay:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agentpanel:${POSTGRES_PASSWORD}@postgres:5432/agentpanel
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
